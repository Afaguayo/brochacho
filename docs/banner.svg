<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Brochacho: text your computer, it texts back">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1f3b"/>
      <stop offset="1" stop-color="#0d0e1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5865F2"/>
      <stop offset="1" stop-color="#D97757"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <circle cx="1040" cy="200" r="150" fill="#5865F2" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1120" cy="260" r="110" fill="#D97757" opacity="0.15" filter="url(#glow)"/>

  <!-- wordmark -->
  <text x="80" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">brochacho</text>
  <rect x="84" y="210" width="210" height="8" rx="4" fill="url(#accent)"/>
  <text x="82" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#c9cbe8">text your computer. it texts back.</text>
  <text x="82" y="320" font-family="Consolas, Menlo, monospace" font-size="20" fill="#7d80a8">Claude Code · Discord · your own PC or Mac</text>

  <!-- chat -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22">
    <rect x="860" y="90" width="300" height="54" rx="20" fill="#5865F2"/>
    <text x="882" y="124" fill="#ffffff">add milk to my to-dos 🥛</text>

    <rect x="900" y="162" width="300" height="54" rx="20" fill="#2b2d4a"/>
    <text x="922" y="196" fill="#e6e7f5">on it… done ✅ pushed</text>

    <rect x="860" y="234" width="250" height="54" rx="20" fill="#5865F2"/>
    <text x="882" y="268" fill="#ffffff">wake the macbook</text>

    <rect x="900" y="306" width="300" height="54" rx="20" fill="#2b2d4a"/>
    <text x="922" y="340" fill="#e6e7f5">magic packet sent ⚡</text>
  </g>
</svg>
